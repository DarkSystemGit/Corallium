[package]
name = "pixelscreen"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
winit = { version = "0.29", default-features = false, features = ["x11", "rwh_06"] }
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "1.0"

[[example]]
name = "bouncing_ball"
path = "examples/bouncing_ball.rs"

[[example]]
name = "keyboard_sprite"
path = "examples/keyboard_sprite.rs"
