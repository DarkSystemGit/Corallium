[package]
name = "Corallium"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.8.0"
bincode = "1.3.3"
bitcode = "0.6.9"
byteorder = "1.5.0"
debug-ignore = "1.0.5"
gamepads = "0.1.7"

hound = "3.5.1"
image = { version = "0.25.8", default-features = true, features = ["jpeg", "png", "webp"] }
indexmap = "2.14.0"
midly = "0.5.3"
minifb = { git ="https://github.com/DarkSystemGit/rust_minifb_pillarbox" }
raw-window-handle = "0.6"
x11-dl = "2.21.0"
prompted = "0.2.8"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
tinyaudio = "2.0.0"
pixelscreen = { path = "src/pixelscreen" }
[profile.release]
debug = true
